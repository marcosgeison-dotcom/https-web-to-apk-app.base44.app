apply plugin: 'com.android.application'

android {
    namespace 'com.siteparaapk.app'
    compileSdk 34

    defaultConfig {
        applicationId "{{PACKAGE}}"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}